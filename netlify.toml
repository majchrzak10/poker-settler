# Poker Settler — Vite build → katalog dist/ (statyczna PWA).
#
# Netlify Dashboard: Build command = npm run build | Publish directory = dist
# Opcjonalnie: zmienne VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY (nadpisują domyślne z src/config.ts).

[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' https://oatfqrijmwdnkztgvzwx.supabase.co wss://oatfqrijmwdnkztgvzwx.supabase.co; manifest-src 'self' blob:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
