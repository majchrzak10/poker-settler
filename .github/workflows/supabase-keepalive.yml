# Keep-alive dla darmowego projektu Supabase.
#
# Free tier pauzuje projekt po ~7 dniach bez aktywności API — apka wtedy
# przestaje działać w całości (auth, sync, wszystko). Ten cron raz dziennie
# odpytuje REST API (zapytanie do bazy przez PostgREST), co liczy się jako
# aktywność i zapobiega pauzie.
#
# Klucz poniżej to PUBLICZNY klucz anon/publishable (ten sam co w src/config.ts)
# — może być w repo. RLS blokuje anon przed odczytem danych; liczy się samo
# dotknięcie bazy.
#
# Uwaga: GitHub wyłącza scheduled workflows po 60 dniach bez aktywności w repo
# — jeśli przyjdzie mail "scheduled workflow disabled", kliknij "Enable" w
# zakładce Actions.

name: Supabase keep-alive

on:
  schedule:
    - cron: '17 3 * * *' # codziennie 03:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          ANON_KEY='sb_publishable_FHu3tWQSK9vt6XJGL3e7Vw_vPm5udfA'
          STATUS=$(curl -s -o /tmp/body -w '%{http_code}' \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" \
            'https://oatfqrijmwdnkztgvzwx.supabase.co/rest/v1/profiles?select=id&limit=1')
          echo "HTTP $STATUS"
          cat /tmp/body
          # 200 = OK (RLS zwróci pustą listę dla anon — to wystarczy jako aktywność)
          [ "$STATUS" = "200" ]
